  <path class="ar" d="M255 218h38"/><path class="ar" d="M540 218h38"/><path class="ar" d="M800 218h38"/><path class="ar" d="M1090 218h38"/>
  <rect class="b" x="565" y="360" width="270" height="105" fill="#fff" stroke="#dc2626"/>
  <text x="700" y="402" class="l">Sign out</text><text x="700" y="435" class="d">Clears member and admin cookies → sign-in</text>
  <path class="ar" d="M970 302c0 65-150 110-123 110"/>
