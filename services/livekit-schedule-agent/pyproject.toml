[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suwanee-livekit-schedule-agent"
version = "0.1.0"
description = "LiveKit voice agent for Suwanee Gamers calendar questions"
requires-python = ">=3.10, <3.15"
dependencies = [
    "livekit-agents[anthropic,elevenlabs,openai,silero]>=1.6.1",
    "python-dotenv",
    "tzdata; platform_system == 'Windows'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]
